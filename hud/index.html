<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<title>JARVIS — Main Frame</title>
<link rel="manifest" href="/hud/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#35e0ff; --cyan-dim:rgba(53,224,255,.28); --cyan-ghost:rgba(53,224,255,.08);
  --gold:#ffd166; --gold-dim:rgba(255,209,102,.4);
  --bg:#02070d; --text:#d8f4ff; --muted:#5f8796;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1200px 800px at 50% -20%, #07202e 0%, var(--bg) 55%), var(--bg);
}
/* ===== ambient layers ===== */
.hex{position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:
    radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(0deg, transparent 0 46px, rgba(53,224,255,.045) 46px 47px, transparent 47px 94px),
    repeating-linear-gradient(60deg, transparent 0 46px, rgba(53,224,255,.035) 46px 47px, transparent 47px 94px),
    repeating-linear-gradient(-60deg, transparent 0 46px, rgba(53,224,255,.035) 46px 47px, transparent 47px 94px);
}
.scanlines{position:fixed;inset:0;pointer-events:none;opacity:.14;z-index:60;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 4px)}
.vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 220px 60px #000;z-index:55}
.grain{position:fixed;inset:-100px;pointer-events:none;z-index:58;opacity:.09;background:transparent;animation:grainShift .7s steps(2) infinite}
@keyframes grainShift{0%{transform:translate(0,0)}25%{transform:translate(-30px,20px)}50%{transform:translate(20px,-25px)}75%{transform:translate(-15px,-10px)}100%{transform:translate(0,0)}}
/* ===== boot overlay ===== */
#boot{position:fixed;inset:0;background:#010508;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 1.1s, visibility 1.1s}
#boot.done{opacity:0;visibility:hidden;pointer-events:none}
#bootGlyph{font-size:3.4rem;letter-spacing:.3em;color:var(--cyan);text-shadow:0 0 30px var(--cyan);animation:glyphPulse 1.4s ease-in-out infinite}
#bootLog{width:min(520px,90vw);font-family:'Cascadia Code',Consolas,monospace;font-size:.72rem;color:#39ffb4;opacity:.85;white-space:pre-wrap;min-height:150px}
@keyframes glyphPulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
/* ===== corner brackets ===== */
.panel{position:absolute;background:linear-gradient(165deg, rgba(13,34,48,.92) 0%, rgba(5,14,22,.9) 60%, rgba(3,9,15,.92) 100%);border:1px solid var(--cyan-dim);padding:12px 14px;backdrop-filter:blur(5px);box-shadow:0 0 32px rgba(53,224,255,.07),inset 0 1px 0 rgba(126,231,255,.22),inset 0 -1px 0 rgba(0,0,0,.6);border-radius:3px}
.panel::before{box-shadow:-4px -4px 12px rgba(0,0,0,.5)}
.panel::after{box-shadow:4px 4px 12px rgba(0,0,0,.5)}
.panel::before,.panel::after{content:"";position:absolute;width:20px;height:20px;opacity:.9}
.panel::before{border-top:2px solid;border-left:2px solid;border-image:linear-gradient(135deg,#ffd166 20%,#8a6a00 100%) 1}
.panel::after{border-bottom:2px solid;border-right:2px solid;border-image:linear-gradient(315deg,#ffd166 20%,#8a6a00 100%) 1}
.panel::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.panel::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.p-title{font-size:.62rem;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,209,102,.18);display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:'Orbitron'}
/* top-left: temporal */
#pTL{top:20px;left:20px;width:270px}
#clock{font-size:2.3rem;font-weight:600;font-family:'Orbitron',monospace;color:var(--cyan);letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(53,224,255,.75)}
#dateLine{font-size:.68rem;color:var(--muted);letter-spacing:.14em;margin-top:2px}
#weatherLine{font-size:.8rem;color:var(--text);margin-top:8px;border-top:1px solid rgba(53,224,255,.14);padding-top:8px}
#weatherLine::before{content:'⛅ '}
#weatherLine b{color:var(--gold)}
/* top-right: vitals */
#pTR{top:20px;right:20px;width:250px}
.vital{margin:7px 0}
.vital .vl{display:flex;justify-content:space-between;font-size:.62rem;letter-spacing:.18em;color:var(--muted);margin-bottom:3px}
.vital .vl b{color:var(--cyan)}
.vbar{height:7px;background:#0d1f2b;overflow:hidden;position:relative}
.vbar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(2,7,13,.85) 9px 11px)}
.vfill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));width:0%;transition:width .5s;box-shadow:0 0 8px var(--cyan-dim)}
/* bottom-left: log */
#pBL{bottom:20px;left:20px;width:310px;max-height:44vh;overflow:auto}
#blItems{list-style:none;font-size:.74rem}
#blItems li{padding:4px 2px;border-bottom:1px solid rgba(53,224,255,.07);color:var(--text);display:flex;gap:8px;align-items:baseline}
#blItems li::before{content:'▸';color:var(--gold)}
#blItems li b{color:var(--gold)}
.empty{color:var(--muted);font-style:italic}
/* bottom-right: command deck */
#pBR{bottom:20px;right:20px;width:250px;text-align:right}
.cmdgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.cmd{background:linear-gradient(180deg,rgba(53,224,255,.08),transparent);border:1px solid var(--cyan-dim);color:var(--cyan);padding:9px 6px;letter-spacing:.18em;font-size:.66rem;cursor:pointer;font-family:'Rajdhani';font-weight:600;transition:all .15s;text-transform:uppercase;border-radius:2px}
.cmd:active{transform:scale(.96)}
.cmd:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.cmd:hover{background:var(--cyan);color:#02141c;box-shadow:0 0 18px var(--cyan-dim)}
.cmd.gold{border-color:var(--gold-dim);color:var(--gold)}
.cmd.gold:hover{background:var(--gold);color:#1a1204;box-shadow:0 0 18px var(--gold-dim)}
/* center: reactor */
#coreWrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;user-select:none}
#statusMode{font-size:.66rem;letter-spacing:.5em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;min-height:1em;font-family:'Orbitron';text-shadow:0 0 14px rgba(255,209,102,.65)}
#reactor{position:relative;width:270px;height:270px;margin:0 auto;cursor:pointer}
.ring{position:absolute;border-radius:50%}
.r-out{inset:0;border:1px solid var(--cyan-dim);border-style:dashed;animation:spin 26s linear infinite}
.r-gold{inset:14px;border:1px solid var(--gold-dim);animation:spin 40s linear infinite reverse}
.r-mid{inset:34px;border:2px solid var(--cyan);opacity:.75;animation:spin 12s linear infinite}
.r-hex{inset:52px;border:1px solid var(--cyan-ghost);animation:spin 18s linear infinite reverse}
.core-glow{position:absolute;inset:70px;border-radius:50%;
  background:radial-gradient(circle,#eafcff 0%,#3fe6ff 26%,#0b6f8f 68%,#021e2c 100%);
  box-shadow:0 0 60px 14px rgba(53,224,255,.55),0 0 130px 40px rgba(53,224,255,.22),inset 0 0 34px rgba(255,255,255,.55);
  animation:corePulse 3.2s ease-in-out infinite}
.core-dot{position:absolute;inset:96px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#bfefff 45%,transparent 75%)}
.r-sweep{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg, rgba(53,224,255,.35), transparent 18%);
  animation:spin 4s linear infinite;opacity:.9}
#transcript{margin-top:14px;font-size:.9rem;color:#c8f4ff;font-style:italic;min-height:1.4em;max-width:560px;margin-left:auto;margin-right:auto;text-shadow:0 0 12px rgba(53,224,255,.35)}
#netState{font-size:.6rem;letter-spacing:.3em;color:var(--muted);margin-top:6px}
#netState .on{color:#57ffa0}
#micHint{font-size:.58rem;letter-spacing:.3em;color:var(--muted);margin-top:2px;text-transform:uppercase}
/* radar */
#radar{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:126px;height:126px;border-radius:50%;border:1px solid var(--cyan-dim);overflow:hidden;opacity:.9}
#radarSweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg, rgba(53,224,255,.5), transparent 30%);animation:spin 3.6s linear infinite}
#radar::after{content:"";position:absolute;inset:28px;border:1px solid var(--cyan-ghost);border-radius:50%}
#radar::before{content:"";position:absolute;inset:52px;border:1px solid var(--cyan-ghost);border-radius:50%}
.blip{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
/* presences tile */
/* toast + fullscreen btn */
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#032018;border:1px solid #57ffa0;color:#8effc1;padding:11px 22px;border-radius:6px;font-size:.82rem;letter-spacing:.08em;opacity:0;pointer-events:none;transition:all .3s;z-index:70}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fsBtn{position:fixed;bottom:14px;right:16px;z-index:70;background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);padding:6px 14px;font-size:.65rem;letter-spacing:.25em;cursor:pointer}
#fsBtn:hover{background:var(--cyan);color:#02141c}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes corePulse{0%,100%{box-shadow:0 0 60px 14px rgba(53,224,255,.55),0 0 130px 40px rgba(53,224,255,.22),inset 0 0 34px rgba(255,255,255,.55)}50%{box-shadow:0 0 85px 22px rgba(53,224,255,.8),0 0 170px 60px rgba(53,224,255,.35),inset 0 0 46px rgba(255,255,255,.75)}}
/* speaking state */
body.speaking .core-glow{animation:corePulse .9s ease-in-out infinite;box-shadow:0 0 90px 24px rgba(255,209,102,.65),0 0 170px 55px rgba(255,209,102,.3),inset 0 0 40px rgba(255,255,255,.7)}
body.speaking #reactor .r-mid{border-color:var(--gold)}
body.speaking #reactor .r-out{border-color:var(--gold-dim)}
body.listening .core-glow{box-shadow:0 0 80px 20px rgba(57,255,180,.6),0 0 150px 50px rgba(57,255,180,.28),inset 0 0 38px rgba(255,255,255,.6)}

.metalring{position:absolute;inset:20px;border-radius:50%;background:conic-gradient(#182a3a 0deg,#2b4b61 45deg,#0c1822 90deg,#2b4b61 135deg,#182a3a 180deg,#2b4b61 225deg,#0c1822 270deg,#2b4b61 315deg,#182a3a 360deg);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%,#000 96%,transparent 97%);mask:radial-gradient(circle,transparent 63%,#000 64%,#000 96%,transparent 97%);opacity:.9}
.bolt{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0%,#ffd166 42%,#241a00 100%);box-shadow:0 0 6px rgba(255,209,102,.65),inset 0 0 3px rgba(0,0,0,.7);z-index:3}
#tickSvg{position:absolute;inset:0;z-index:2;overflow:visible}
.bootbar{width:min(340px,80vw);height:2px;background:#0d2230;overflow:hidden}
#bootFill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .3s;box-shadow:0 0 12px var(--cyan)}
.core-glow{background:radial-gradient(circle,#ffffff 0%,#5df0ff 20%,#0f7fa5 55%,#032838 92%) !important}

/* ============ MOTION SYSTEM ============ */
@keyframes panelIn{0%{opacity:0;transform:translateY(26px) scale(.96);filter:blur(6px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
#pTL{animation:panelIn .8s .10s both}
#pTR{animation:panelIn .8s .22s both}
#coreWrap{animation:panelIn 1s .35s both}
#radar{animation:panelIn .8s .5s both}
#pBL{animation:panelIn .8s .62s both}
#pBR{animation:panelIn .8s .74s both}

/* reactor boot-on: quick power surge */
@keyframes reactorIgnite{0%{filter:brightness(0) saturate(0)}25%{filter:brightness(2.4) saturate(.4)}45%{filter:brightness(.4)}70%{filter:brightness(1.8)}100%{filter:brightness(1)}}
#reactor{animation:reactorIgnite 1.5s .35s both}

/* 3D parallax tilt on reactor */
#coreWrap{transition:transform .25s cubic-bezier(.2,.9,.25,1);will-change:transform}
#reactor .ring, #reactor .core-glow, #reactor .core-dot{will-change:transform}

/* sonar blip ping */
@keyframes blipPing{0%,100%{opacity:.15;transform:scale(.6)}12%{opacity:1;transform:scale(1.6)}30%{opacity:.6;transform:scale(1)}}
.blip{animation:blipPing 3.6s infinite}
.blip:nth-child(3){animation-delay:1.2s}
.blip:nth-child(4){animation-delay:2.3s}

/* expanding ripple when listening */
@keyframes rippleOut{0%{box-shadow:0 0 0 0 rgba(53,224,255,.55),0 0 0 0 rgba(255,209,102,.4)}100%{box-shadow:0 0 0 120px rgba(53,224,255,0),0 0 0 200px rgba(255,209,102,0)}}
body.listening #reactor{animation:reactorIgnite 1.2s both, rippleOut 1.6s ease-out infinite}

/* sheen sweep across command buttons */
.cmd{position:relative;overflow:hidden}
.cmd::after{content:'';position:absolute;top:-120%;left:-80%;width:50%;height:320%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:rotate(18deg);transition:left .7s ease}
.cmd:hover::after{left:220%}
.cmd.gold::after{background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent)}

/* blinking terminal cursor on transcript */
@keyframes cursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
#transcript::after{content:' ▊';color:var(--cyan);animation:cursorBlink 1.1s infinite}

/* slow ambient pan of hex backdrop */
@keyframes hexDrift{0%{transform:translate(0,0)}50%{transform:translate(-28px,14px)}100%{transform:translate(0,0)}}
.hex{animation:hexDrift 26s ease-in-out infinite}

/* vital bars: subtle shimmer traveling across fill */
@keyframes barSheen{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.vfill{background:linear-gradient(90deg,var(--cyan) 0%,#7de8ff 25%,var(--gold) 50%,#7de8ff 75%,var(--cyan) 100%);background-size:300% 100%;animation:barSheen 6s linear infinite}

/* respect reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

/* ============ MARK SUITS ============ */
body.skin-m85{--cyan:#ff5340;--cyan-dim:rgba(255,83,64,.32);--cyan-ghost:rgba(255,83,64,.1);--gold:#ffc740;--gold-dim:rgba(255,199,64,.45);--bg:#0e0503;--text:#ffe8d6;--muted:#8a5a4e}
body.skin-m85{background:radial-gradient(1200px 800px at 50% -20%, #2e1006 0%, var(--bg) 55%)}
body.skin-m85 .panel{background:linear-gradient(165deg, rgba(48,18,8,.92) 0%, rgba(22,8,4,.9) 60%, rgba(14,5,3,.92) 100%)}
body.skin-m85 .hex{background-image:radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%),repeating-linear-gradient(0deg, transparent 0 46px, rgba(255,83,64,.05) 46px 47px, transparent 47px 94px),repeating-linear-gradient(60deg, transparent 0 46px, rgba(255,83,64,.04) 46px 47px, transparent 47px 94px),repeating-linear-gradient(-60deg, transparent 0 46px, rgba(255,83,64,.04) 46px 47px, transparent 47px 94px)}
body.skin-m85 .core-glow{background:radial-gradient(circle,#fff 0%,#ffb15d 22%,#a63c12 58%,#250b04 96%) !important;box-shadow:0 0 65px 18px rgba(255,83,64,.6),0 0 140px 45px rgba(255,83,64,.28),inset 0 0 34px rgba(255,255,255,.5) !important}
body.skin-m85 .metalring{background:conic-gradient(#3a1610 0deg,#5a2a18 45deg,#1c0c08 90deg,#5a2a18 135deg,#3a1610 180deg,#5a2a18 225deg,#1c0c08 270deg,#5a2a18 315deg,#3a1610 360deg) !important}
body.skin-m85 #clock{text-shadow:0 0 22px rgba(255,83,64,.8)}
body.skin-m42{--cyan:#f2e9d8;--cyan-dim:rgba(242,233,216,.3);--cyan-ghost:rgba(242,233,216,.1);--gold:#e8c15a;--gold-dim:rgba(232,193,90,.5);--bg:#0e0d08;--text:#efe6d5;--muted:#8d867a}
body.skin-m42{background:radial-gradient(1200px 800px at 50% -20%, #241f12 0%, var(--bg) 55%)}
body.skin-m42 .panel{background:linear-gradient(165deg, rgba(40,36,24,.92) 0%, rgba(18,16,10,.9) 60%, rgba(12,11,7,.92) 100%)}
body.skin-m42 .hex{background-image:radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%),repeating-linear-gradient(0deg, transparent 0 46px, rgba(232,193,90,.05) 46px 47px, transparent 47px 94px),repeating-linear-gradient(60deg, transparent 0 46px, rgba(232,193,90,.04) 46px 47px, transparent 47px 94px),repeating-linear-gradient(-60deg, transparent 0 46px, rgba(232,193,90,.04) 46px 47px, transparent 47px 94px)}
body.skin-m42 .core-glow{background:radial-gradient(circle,#fffdf4 0%,#f0d98a 25%,#8a6a00 62%,#241a04 96%) !important;box-shadow:0 0 60px 16px rgba(232,193,90,.55),0 0 130px 40px rgba(232,193,90,.25),inset 0 0 34px rgba(255,255,255,.5) !important}
body.skin-m42 .metalring{background:conic-gradient(#3a3320 0deg,#544a2e 45deg,#1e1a10 90deg,#544a2e 135deg,#3a3320 180deg,#544a2e 225deg,#1e1a10 270deg,#544a2e 315deg,#3a3320 360deg) !important}
body.skin-m42 #clock{text-shadow:0 0 22px rgba(242,233,216,.6)}

/* ============ RED ALERT ============ */
@keyframes alertPulse{0%,100%{box-shadow:inset 0 0 220px 60px #000, inset 0 0 120px 30px rgba(255,40,20,.28)}50%{box-shadow:inset 0 0 260px 80px #000, inset 0 0 160px 60px rgba(255,40,20,.5)}}
body.alert .vignette{animation:alertPulse 1s ease-in-out infinite}
body.alert .p-title{color:#ff6b4a;border-bottom-color:rgba(255,80,60,.35)}
@keyframes alertFlash{0%,100%{opacity:1}50%{opacity:.35}}
body.alert .cmd, body.alert .p-title{animation:alertFlash 1s step-end infinite}

/* skin/hum buttons bottom-left */
.sideBtn{position:fixed;bottom:14px;z-index:70;background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);padding:6px 14px;font-size:.62rem;letter-spacing:.22em;cursor:pointer;text-transform:uppercase}
.sideBtn:hover{background:var(--cyan);color:#02141c}
#skinBtn{left:16px}
#humBtn{left:170px}
.sideBtn.active{background:var(--cyan);color:#02141c}
@media (max-width:900px){
  #pTL,#pTR{top:10px;width:180px}#pBL,#pBR{width:180px;bottom:10px}
  #reactor{width:190px;height:190px}.core-glow{inset:54px}.core-dot{inset:72px}
  .r-gold{inset:10px}.r-mid{inset:26px}.r-hex{inset:40px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="grainFilter"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feColorMatrix type="saturate" values="0" in="n"/></filter>
  <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b3a4d"/><stop offset=".35" stop-color="#0a1a26"/><stop offset=".5" stop-color="#2a4a5f"/><stop offset=".65" stop-color="#071219"/><stop offset="1" stop-color="#16283a"/></linearGradient>
  <radialGradient id="boltGrad"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#ffd166"/><stop offset="1" stop-color="#3a2a00"/></radialGradient>
</defs></svg>
<canvas id="bgfx" style="position:fixed;inset:0;z-index:1;pointer-events:none"></canvas>
<div class="hex"></div>
<div class="scanlines"></div>
<div class="grain" style="filter:url(#grainFilter);background:#888"></div>
<div class="vignette"></div>

<!-- BOOT OVERLAY -->
<div id="boot">
  <div id="bootGlyph">J A R V I S</div>
  <div class="bootbar"><div id="bootFill"></div></div>
  <div id="bootLog"></div>
</div>

<!-- TOP LEFT : temporal -->
<div class="panel" id="pTL">
  <div class="p-title"><span>Temporal</span><span style="color:var(--cyan)">◉</span></div>
  <div id="clock">--:--:--</div>
  <div id="dateLine">—</div>
  <div id="weatherLine">Weather: <b>…</b></div>
</div>

<!-- TOP RIGHT : vitals -->
<div class="panel" id="pTR">
  <div class="p-title"><span>Vital Signs</span><span style="color:var(--cyan)" id="netDot">OFFLINE</span></div>
  <div class="vital"><div class="vl"><span>CPU</span><b id="cpuVal">–</b></div><div class="vbar"><div class="vfill" id="cpuBar"></div></div></div>
  <div class="vital"><div class="vl"><span>MEMORY</span><b id="ramVal">–</b></div><div class="vbar"><div class="vfill" id="ramBar"></div></div></div>
  <div class="vital"><div class="vl"><span>DISK</span><b id="diskVal">–</b></div><div class="vbar"><div class="vfill" id="diskBar"></div></div></div>
</div>

<!-- CENTER : arc reactor -->
<div id="coreWrap">
  <div id="statusMode">STANDBY</div>
  <div id="reactor" title="Speak to JARVIS">
    <svg id="tickSvg" viewBox="0 0 270 270"></svg>
    <div class="metalring"></div>
    <div class="ring r-sweep"></div>
    <div class="ring r-out"></div>
    <div class="ring r-gold"></div>
    <div class="ring r-mid"></div>
    <div class="ring r-hex"></div>
    <div class="core-glow"></div>
    <div class="core-dot"></div>
  </div>

<div id="radar"><div id="radarSweep"></div><div class="blip" style="top:34%;left:60%"></div><div class="blip" style="top:62%;left:36%"></div><div class="blip" style="top:44%;left:74%"></div></div>

<div class="panel" id="pBR">

  <div class="cmdgrid">

    <button class="cmd gold" id="btnSuit">🦾 Suit Up</button>

<div id="toast"></div>

<button class="sideBtn" id="humBtn">◉ HUM</button>
<button id="fsBtn">⛶ FULLSCREEN</button>

<script>
const $ = s => document.querySelector(s);
/* ============ BOOT SEQUENCE ============ */
const bootLines = [
  'JARVIS v6.1 — IRON FRAME INTERFACE',
  'LOCATING PRIMARY AI KERNEL…',
  'NEURAL LINK ……………………… ONLINE',
  'GROQ CORE (gpt-oss-20b) …… ONLINE',
  'SENSOR ARRAY ………………… … ONLINE',
  'VOICE UPLINK ……………… … ONLINE',
  'BIOMETRIC LOCK …………… … STANDBY',
  'CALIBRATING ARC REACTOR…',
  'ALL SYSTEMS NOMINAL.',
];
let bi = 0;
const bootLog = document.getElementById('bootLog');
function bootStep(){
  if (bi < bootLines.length){
    bootLog.textContent += bootLines[bi] + '\n';
    bi++;
    setTimeout(bootStep, 210);
  } else {
    setTimeout(() => document.getElementById('boot').classList.add('done'), 650);
  }
}
document.getElementById('boot').addEventListener('click', () => document.getElementById('boot').classList.add('done'));
bootStep();

/* ============ HUD AUDIO (WebAudio) ============ */
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function tone(f, d, type, gain, when=0){
  const ctx = ac(); const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, ctx.currentTime + when);
  g.gain.exponentialRampToValueAtTime(gain || 0.12, ctx.currentTime + when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + when + (d || 0.28));
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime + when); o.stop(ctx.currentTime + when + (d || 0.28) + 0.05);
}
function sfx(kind){
  try{
    if (kind === 'chirp'){ tone(880, .1, 'sine', .12); tone(1320, .18, 'sine', .12, .09); }
    else if (kind === 'ping'){ tone(1760, .12, 'sine', .1); }
    else if (kind === 'confirm'){ tone(660, .09, 'triangle', .14); tone(990, .16, 'triangle', .14, .08); }
    else if (kind === 'error'){ tone(140, .25, 'sawtooth', .1); }
    else if (kind === 'boot'){ tone(220, .5, 'sine', .1); tone(440, .5, 'sine', .1, .25); tone(880, .6, 'sine', .12, .5); }
    else if (kind === 'activate'){ tone(520, .35, 'sine', .14); tone(1040, .4, 'sine', .12, .12); }
  }catch(e){}
}


/* ============ MARK SUIT SKIN ============ */
const SKINS = [{id:'m1',label:'◈ MARK I'},{id:'m42',label:'◈ MARK 42'},{id:'m85',label:'◈ MARK 85'}];
function applySkin(id){ document.body.classList.remove('skin-m42','skin-m85'); if (id !== 'm1') document.body.classList.add('skin-' + id); localStorage.setItem('jarvis_skin', id); const b = document.getElementById('skinBtn'); const cur = SKINS.find(x => x.id === id) || SKINS[0]; b.textContent = cur.label; }
document.getElementById('skinBtn').addEventListener('click', () => { const cur = localStorage.getItem('jarvis_skin') || 'm1'; const idx = SKINS.findIndex(x => x.id === cur); applySkin(SKINS[(idx + 1) % SKINS.length].id); sfx('ping'); });
applySkin(localStorage.getItem('jarvis_skin') || 'm1');

/* ============ RED ALERT MODE ============ */
let alertTimer = null;
function raiseAlert(msg){
  document.body.classList.add('alert');
  showToast('⚠ REMINDER: ' + msg);
  try{
    [0, .35, .7, 1.05].forEach(t => { tone(392, .28, 'sawtooth', .16, t); tone(233, .28, 'sawtooth', .16, t + .18); });
  }catch(e){}
  clearTimeout(alertTimer);
  alertTimer = setTimeout(() => document.body.classList.remove('alert'), 18000);
}
document.addEventListener('click', () => { if (document.body.classList.contains('alert')){ document.body.classList.remove('alert'); clearTimeout(alertTimer); } });

/* ============ AMBIENT REACTOR HUM ============ */
let humNodes = null;
function toggleHum(){
  const btn = document.getElementById('humBtn');
  if (humNodes){ humNodes.forEach(n => { try { n.stop(); } catch(e){} }); humNodes = null; btn.classList.remove('active'); btn.textContent = '◉ HUM'; return; }
  try{
    const ctx = ac();
    const g = ctx.createGain(); g.gain.value = 0.05;
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 200; filter.Q.value = 8;
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 54;
    const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 54.4;
    const o3 = ctx.createOscillator(); o3.type = 'triangle'; o3.frequency.value = 108;
    const g3 = ctx.createGain(); g3.gain.value = 0.4;
    o1.connect(filter); o2.connect(filter); o3.connect(g3); g3.connect(filter); filter.connect(g); g.connect(ctx.destination);
    o1.start(); o2.start(); o3.start();
    humNodes = [o1, o2, o3];
    btn.classList.add('active'); btn.textContent = '◉ HUM ON';
  }catch(e){}
}
document.getElementById('humBtn').addEventListener('click', toggleHum);

/* ============ CLOCK + WEATHER ============ */
function tick(){
  const n = new Date();
  document.getElementById('clock').textContent = n.toLocaleTimeString('en-GB');
  document.getElementById('dateLine').textContent = n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();
}
setInterval(tick, 1000); tick();
let weatherCache = 'loading…';
async function pollWeather(){
  try{
    const w = await (await fetch('/api/weather')).json();
    const reply = (w.text || 'unavailable').replace(/</g,'&lt;');
    document.getElementById('weatherLine').innerHTML = 'Weather: <b>' + reply.slice(0,110) + '</b>';
  }catch(e){ document.getElementById('weatherLine').innerHTML = 'Weather: <b>offline</b>'; }
}
pollWeather(); setInterval(pollWeather, 15 * 60 * 1000);

/* ============ WS LINK ============ */
let ws, retry = 0;
const netDot = document.getElementById('netDot');
function net(on){ netDot.textContent = on ? 'ONLINE' : 'OFFLINE'; netDot.style.color = on ? '#57ffa0' : '#ff6b6b'; document.getElementById('netState').innerHTML = on ? '<span class="on">●</span> LINK' : '<span style="color:#ff6b6b">●</span> LINK LOST'; }
function setMode(m){ document.getElementById('statusMode').textContent = m; document.body.classList.remove('speaking','listening'); if (m === 'LISTENING') document.body.classList.add('listening'); if (m === 'SPEAKING' || m === 'THINKING') document.body.classList.add('speaking'); }
function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen = () => { retry = 0; net(true); sfx('chirp'); setMode('ONLINE'); };
  ws.onclose = () => { net(false); setMode('RECONNECTING'); setTimeout(connect, Math.min(1000*2**retry++, 15000)); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'status') setMode(String(m.value || 'idle').toUpperCase());
    else if (m.type === 'transcript'){ document.getElementById('transcript').textContent = '“' + m.text + '”'; }
    else if (m.type === 'reply_end' && m.text){ document.getElementById('transcript').textContent = m.text.slice(0, 220); }
    else if (m.type === 'reply_start'){ setMode('THINKING'); }
    else if (m.type === 'error'){ document.getElementById('statusMode').textContent = 'ERROR'; document.getElementById('transcript').textContent = m.text; sfx('error'); }
    else if (m.type === 'reminder_fired'){ raiseAlert(m.text); }
  };
}
connect();

/* ============ REACTOR: voice trigger ============ */
function activate(){
  sfx('activate');
  if (ws && ws.readyState === 1){ setMode('LISTENING'); document.getElementById('transcript').textContent = 'listening…'; ws.send(JSON.stringify({type:'voice'})); }
  else { document.getElementById('statusMode').textContent = 'NO LINK'; document.getElementById('transcript').textContent = 'Server offline — try JARVIS.bat'; sfx('error'); }
}
document.getElementById('reactor').addEventListener('click', activate);
document.getElementById('btnMic').addEventListener('click', activate);

/* ============ COMMAND DECK ============ */
$('#btnChat').addEventListener('click', () => { sfx('ping'); location.href = '/chat'; });
$('#btnSuit').addEventListener('click', () => { sfx('ping'); location.href = '/chat?prefill=' + encodeURIComponent('Suit up. Give me my diagnostic report.'); });
$('#btnSweep').addEventListener('click', () => { sfx('ping'); location.href = '/chat?prefill=' + encodeURIComponent('Run a full security sweep.'); });
$('#btnBrief').addEventListener('click', () => { sfx('ping'); location.href = '/chat?prefill=' + encodeURIComponent('Give me my daily briefing'); });
$('#btnNews').addEventListener('click', () => { sfx('ping'); location.href = '/chat?prefill=' + encodeURIComponent('Give me the top news headlines'); });
$('#btnWeather').addEventListener('click', () => { sfx('ping'); location.href = '/chat?prefill=' + encodeURIComponent('What is the weather like?'); });
$('#btnAnswer').addEventListener('click', () => { sfx('ping'); location.href = '/chat?prefill=' + encodeURIComponent('How are you, JARVIS?'); });

/* ============ TOAST ============ */
let toastTimer = null;
function showToast(t){
  const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 9000);
}

/* ============ VITALS + LOG POLL ============ */
async function poll(){
  try{
    const s = await (await fetch('/api/stats')).json();
    if (s.cpu != null){
      $('#cpuVal').textContent = s.cpu.toFixed(0) + '%'; $('#cpuBar').style.width = s.cpu + '%';
      $('#ramVal').textContent = s.ram.toFixed(0) + '%'; $('#ramBar').style.width = s.ram + '%';
      $('#diskVal').textContent = (s.disk ?? 0).toFixed(0) + '%'; $('#diskBar').style.width = (s.disk ?? 0) + '%';
    }
    const reminders = await (await fetch('/api/reminders')).json();
    const todos = await (await fetch('/api/todos')).json();
    const facts = await (await fetch('/api/facts')).json().then(d => d.facts);
    const el = document.getElementById('blItems');
    const rows = [];
    reminders.slice(0,3).forEach(r => rows.push(`<li>⏰ <b>reminder</b> ${r.text}</li>`));
    todos.slice(0,3).forEach(t => rows.push(`<li>☐ <b>todo</b> ${t.text}</li>`));
    facts.slice(0,2).forEach(f => rows.push(`<li>🧠 <b>memory</b> ${f}</li>`));
    el.innerHTML = rows.length ? rows.join('') : '<li class="empty">log empty — systems nominal</li>';
  }catch(e){/* offline */}
}
setInterval(poll, 5000); poll();

/* ============ FULLSCREEN ============ */
const fsBtn = document.getElementById('fsBtn');
function toggleFs(){
  if (!document.fullscreenElement){ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); fsBtn.textContent = '⛶ EXIT'; }
  else document.exitFullscreen();
}
fsBtn.addEventListener('click', toggleFs);
document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F'){ if (!e.metaKey && !e.ctrlKey) toggleFs(); } });
document.addEventListener('fullscreenchange', () => fsBtn.textContent = document.fullscreenElement ? '⛶ EXIT' : '⛶ FULLSCREEN');



/* ============ 3D PARALLAX ON REACTOR ============ */
(function parallax(){
  const wrap = document.getElementById('coreWrap');
  const reactor = document.getElementById('reactor');
  const fine = matchMedia('(pointer:fine)').matches;
  if (!fine) return;
  let tx = 0, ty = 0, cx = 0, cy = 0;
  addEventListener('mousemove', e => {
    tx = (e.clientX / innerWidth - 0.5);
    ty = (e.clientY / innerHeight - 0.5);
  });
  function loop(){
    cx += (tx - cx) * 0.06;
    cy += (ty - cy) * 0.06;
    wrap.style.transform = `translate(calc(-50% + ${cx * 22}px), calc(-50% + ${cy * 18}px))`;
    if (reactor) reactor.style.transform = `rotate(${cx * 4}deg) scale(${1 + Math.abs(cx) * 0.03})`;
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ============ FX: tick ring + bolts + particles ============ */
(function buildTicks(){
  const svg = document.getElementById('tickSvg'); if (!svg) return;
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 135, cy = 135, R1 = 128, R2 = 136, R3 = 146;
  for (let i = 0; i < 72; i++){
    const ang = i * 5 * Math.PI / 180;
    const big = i % 6 === 0;
    const r1 = big ? R1 - 10 : R1;
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', cx + Math.cos(ang) * r1);
    line.setAttribute('y1', cy + Math.sin(ang) * r1);
    line.setAttribute('x2', cx + Math.cos(ang) * R2);
    line.setAttribute('y2', cy + Math.sin(ang) * R2);
    line.setAttribute('stroke', big ? '#ffd166' : 'rgba(53,224,255,.55)');
    line.setAttribute('stroke-width', big ? 2.4 : 1.1);
    svg.appendChild(line);
  }
  const angles = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];
  angles.forEach(a => {
    const ang = a * Math.PI / 180;
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', cx + Math.cos(ang) * R3);
    t.setAttribute('y', cy + Math.sin(ang) * R3 + 4);
    t.setAttribute('fill', '#ffd166');
    t.setAttribute('font-size', '13');
    t.setAttribute('font-family', 'Consolas, monospace');
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('opacity', '0.85');
    t.textContent = String(a).padStart(3, '0');
    svg.appendChild(t);
  });
  // bolts on the metallic ring
  const reactor = document.getElementById('reactor');
  for (let i = 0; i < 6; i++){
    const ang = (i * 60 + 30) * Math.PI / 180;
    const b = document.createElement('div');
    b.className = 'bolt';
    b.style.left = (135 + Math.cos(ang) * 99 - 6) + 'px';
    b.style.top = (135 + Math.sin(ang) * 99 - 6) + 'px';
    reactor.appendChild(b);
  }
})();

(function emberField(){
  const c = document.getElementById('bgfx'); if (!c) return;
  const ctx = c.getContext('2d');
  let W, H, parts = [];
  function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  for (let i = 0; i < 80; i++) parts.push(spawn(true));
  function spawn(init){
    return { x: Math.random() * (innerWidth), y: init ? Math.random() * innerHeight : innerHeight + 10,
             r: Math.random() * 1.8 + 0.4, vy: -(Math.random() * 0.35 + 0.12),
             vx: (Math.random() - 0.5) * 0.25, gold: Math.random() < 0.18, o: Math.random() * 0.6 + 0.25 };
  }
  function frame(){
    ctx.clearRect(0, 0, W, H);
    for (let p of parts){
      p.y += p.vy; p.x += p.vx; p.o -= 0.0012;
      if (p.y < -10 || p.o <= 0) Object.assign(p, spawn(false));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.gold ? 'rgba(255,209,102,' + p.o + ')' : 'rgba(53,224,255,' + p.o + ')';
      ctx.shadowBlur = 6; ctx.shadowColor = p.gold ? '#ffd166' : '#35e0ff';
      ctx.fill(); ctx.shadowBlur = 0;
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

// boot progress bar sync
(function syncBootBar(){
  const fill = document.getElementById('bootFill'); if (!fill) return;
  let p = 0;
  const iv = setInterval(() => {
    p = Math.min(100, p + Math.random() * 22);
    fill.style.width = p + '%';
    if (p >= 100) clearInterval(iv);
  }, 160);
})();

/* ============ WEATHER POLL FOR FIRST PAINT ============ */
sfXChirpOnLoad();
function sfXChirpOnLoad(){ setTimeout(() => sfx('boot'), 80); }
</script>
